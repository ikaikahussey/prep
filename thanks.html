<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-up received</title>
<style>
  body{margin:0;background:#FFF;color:#000;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:48px 24px}
  h1{font-size:26px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
  ul{padding-left:22px;margin:0 0 16px}
  li{margin-bottom:6px}
  a{color:#CC0000}
  a:focus-visible{outline:2px solid #CC0000;outline-offset:2px}
  p.note{color:#555;font-size:14px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Sign-up received</h1>
    <p>Next steps:</p>
    <ul>
      <li>Notify the four households that you have signed up to check on them.</li>
      <li>Register for county emergency notifications if you have not done so.</li>
    </ul>
    <p><a href="/">Return to the checklist</a></p>
    <p class="note">Emergencies: call 911.</p>
  </div>
</body>
</html>
